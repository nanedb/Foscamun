name: Build and Release

on:
  push:  # Evaluated on every push; the job itself only runs for tags (see job-level `if` below)
  workflow_dispatch:  # Allow manual trigger

# The job creates the GitHub release, so its token must be able to write
permissions:
  contents: write

jobs:
  build:
    # Skip (not fail) on ordinary branch pushes — only run for version tags or a manual dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      run: dotnet test --no-restore --verbosity normal
      continue-on-error: true  # Continue even if tests fail
      
    - name: Publish Windows x64
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishReadyToRun=true `
          -o ./publish/win-x64
          
    - name: Publish Windows x86
      run: |
        dotnet publish -c Release -r win-x86 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishReadyToRun=true `
          -o ./publish/win-x86
          
    - name: Publish Windows ARM64
      run: |
        dotnet publish -c Release -r win-arm64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishReadyToRun=true `
          -o ./publish/win-arm64
          
    - name: Create README files
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        $readmeContent = @"
        Foscamun $version

        INSTALLAZIONE:
        1. Estrai tutti i file in una cartella
        2. Esegui Foscamun.exe

        REQUISITI:
        - Windows 10 o superiore

        Repository: https://github.com/nanedb/Foscamun
        "@
        
        Set-Content -Path "./publish/win-x64/README.txt" -Value $readmeContent
        Set-Content -Path "./publish/win-x86/README.txt" -Value $readmeContent
        Set-Content -Path "./publish/win-arm64/README.txt" -Value $readmeContent
        
    - name: Create Archives
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        Compress-Archive -Path "./publish/win-x64/*" -DestinationPath "./Foscamun-win-x64-$version.zip"
        Compress-Archive -Path "./publish/win-x86/*" -DestinationPath "./Foscamun-win-x86-$version.zip"
        Compress-Archive -Path "./publish/win-arm64/*" -DestinationPath "./Foscamun-win-arm64-$version.zip"
        
    - name: Create Installers
      shell: pwsh
      run: |
        # Inno Setup 6 is preinstalled on the Windows runners
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        $version = "${{ github.ref_name }}".TrimStart('v')
        foreach ($rid in "win-x64", "win-x86", "win-arm64") {
          & $iscc /Q "/DAppVersion=$version" "/DArch=$rid" "/DSourceDir=$PWD\publish\$rid" "/DOutputDir=$PWD" installer\Foscamun.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Calculate Checksums
      shell: pwsh
      run: |
        $files = Get-ChildItem -File | Where-Object { $_.Name -like "Foscamun-*.zip" -or $_.Name -like "Foscamun-Setup-*.exe" }
        $checksums = @("# SHA256 Checksums", "")
        foreach ($file in $files) {
          $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
          $checksums += "$hash  $($file.Name)"
        }
        $checksums | Out-File -FilePath "SHA256SUMS.txt" -Encoding UTF8
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          Foscamun-win-x64-*.zip
          Foscamun-win-x86-*.zip
          Foscamun-win-arm64-*.zip
          Foscamun-Setup-*.exe
          SHA256SUMS.txt
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}  # e.g. v2.1.0-beta.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
